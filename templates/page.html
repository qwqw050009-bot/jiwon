{% extends "base.html" %}
{% block jsonld %}{% if jsonld %}<script type="application/ld+json">{{ jsonld|safe }}</script>{% endif %}{% if article_jsonld %}<script type="application/ld+json">{{ article_jsonld|safe }}</script>{% endif %}{% endblock %}
{% block body %}
<div class="head">
  <h1>{{ h1 }}</h1>
</div>
<div class="notice prose page-body">{{ content|safe }}{% if updated %}<p class="note page-updated">마지막 수정 <time datetime="{{ updated }}">{{ updated }}</time></p>{% endif %}</div>
{% endblock %}
