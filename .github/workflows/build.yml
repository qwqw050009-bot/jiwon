name: build and deploy

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: build
        run: python src/build.py
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          KSTARTUP_KEY: ${{ secrets.KSTARTUP_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: commit cache
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/enrich_cache.json data/seen.json data/archive.json data/kstartup_cache.json || true
          git diff --staged --quiet || git commit -m "data update"
          git push || true
      - name: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=jiwon --branch=main
