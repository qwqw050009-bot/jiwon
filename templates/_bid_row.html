{% macro row(a) %}
<a class="row" href="/bid/notice/{{ a.id }}/">
  <div class="dday {{ a.cls }}">{{ a.dlabel }}<small>{{ a.dsub }}</small></div>
  <div>
    <h3>{{ a.title }}</h3>
    <div class="meta"><i>{{ a.org }}</i><i>{{ a.kind }}</i>{% if a.region %}<i>{{ a.region }}</i>{% endif %}{% if a.budget_card %}<i class="amt">{{ a.budget_card }}</i>{% endif %}</div>
  </div>
</a>
{% endmacro %}
